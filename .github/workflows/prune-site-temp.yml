name: Temporary CCT legacy prune

on:
  pull_request:
    branches: [main]
    types: [reopened, synchronize]

permissions:
  contents: write

jobs:
  prune:
    if: github.head_ref == 'frontend-production-readiness-2026-08-23'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v7
        with:
          ref: frontend-production-readiness-2026-08-23
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prune proven dead functions
        run: node scripts/prune-site-dead.mjs
      - name: Syntax check
        run: node --check site.js
      - name: Commit pruning when needed
        shell: bash
        run: |
          if git diff --quiet -- site.js; then
            echo "No pruning changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.js
          git commit -m "Poda funciones legacy sin referencias"
          git push origin HEAD:frontend-production-readiness-2026-08-23

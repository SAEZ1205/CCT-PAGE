name: Materializar foto Nosotros

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'nosotros-crossfade-final-2026-08-24' || github.ref_name == 'nosotros-crossfade-final-2026-08-24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nosotros-crossfade-final-2026-08-24
          fetch-depth: 0

      - name: Materializar WebP nítido
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp-q85/q85-*.b64 | base64 --decode > assets/equipo-cct-2026-grupal.webp
          test "$(stat -c%s assets/equipo-cct-2026-grupal.webp)" -eq 47156
          echo "35bbb0e495e69fd6f2726658f7e9624474235a77eee8b8184ed1ba79cd5192e3  assets/equipo-cct-2026-grupal.webp" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/equipo-cct-2026-grupal.webp
          if git diff --cached --quiet; then
            echo "El asset ya estaba materializado."
            exit 0
          fi
          git commit -m "Materializa segunda foto nítida de Nosotros"
          git push origin HEAD:nosotros-crossfade-final-2026-08-24

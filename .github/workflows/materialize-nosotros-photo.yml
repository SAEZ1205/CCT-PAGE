name: Materializar fotos Nosotros

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'nosotros-crossfade-final-2026-08-24' || github.ref_name == 'nosotros-crossfade-final-2026-08-24'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nosotros-crossfade-final-2026-08-24
          fetch-depth: 0

      - name: Materializar los dos WebP y retirar transporte temporal
        shell: bash
        run: |
          set -euo pipefail

          cat .tmp-image-upload/p1-*.b64 | base64 --decode > assets/equipo-cct-2026.webp
          cat .tmp-q85/q85-*.b64 | base64 --decode > assets/equipo-cct-2026-grupal.webp

          test "$(stat -c%s assets/equipo-cct-2026.webp)" -gt 80000
          test "$(stat -c%s assets/equipo-cct-2026-grupal.webp)" -eq 47156
          file assets/equipo-cct-2026.webp | grep -qi 'Web/P\|WebP'
          file assets/equipo-cct-2026-grupal.webp | grep -qi 'Web/P\|WebP'
          echo "35bbb0e495e69fd6f2726658f7e9624474235a77eee8b8184ed1ba79cd5192e3  assets/equipo-cct-2026-grupal.webp" | sha256sum -c -

          rm -rf .tmp-image-upload .tmp-q85
          rm -f .github/workflows/materialize-nosotros-photo.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materializa fotos nítidas y limpia temporales de Nosotros"
          git push origin HEAD:nosotros-crossfade-final-2026-08-24

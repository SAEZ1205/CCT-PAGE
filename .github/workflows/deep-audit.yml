name: CCT Deep Architecture Audit

on:
  push:
    branches: [deep-rearchitecture-2026-08-23]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deep static audit
        run: node scripts/deep-audit.mjs
      - name: Existing architecture checks
        run: node scripts/check-architecture.mjs

name: CCT Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Deep architecture audit
        run: npm run audit:deep
      - name: Architecture + TypeScript + Vite + dist smoke test
        run: npm run build
      - name: Real browser smoke test
        run: npm run check:browser

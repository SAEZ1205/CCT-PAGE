name: Split legacy snapshot (temporary)

on:
  push:
    branches: [deep-rearchitecture-2026-08-23]

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deep-rearchitecture-2026-08-23
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate canonical markup files
        run: node scripts/split-snapshot.mjs
      - name: Commit generated markup
        run: |
          if git diff --quiet -- src/pages src/layout; then
            echo "Markup already split"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages src/layout
          git commit -m "refactor: split snapshot into canonical markup files"
          git push

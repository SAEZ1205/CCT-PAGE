<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aula modular de Open Course CCT">
  <title>Open Course CCT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="course.css">
</head>
<body>
  <header class="course-header">
    <a class="course-brand" href="index.html#formacion" aria-label="Volver a Formación CCT"><img src="assets/logo_wordmark.png" alt="CCT UNI"></a>
    <div class="course-head-center"><span>OPEN COURSE CCT</span><strong id="headerCourseName">Cargando curso…</strong></div>
    <a class="course-exit" href="index.html#formacion">Volver a Formación <b>↗</b></a>
  </header>

  <main class="course-shell">
    <aside class="module-sidebar" id="moduleSidebar">
      <div class="sidebar-title"><span>CONTENIDO</span><button id="sidebarToggle" type="button" aria-label="Mostrar u ocultar módulos">Módulos ☰</button></div>
      <label class="module-search"><span>⌕</span><input id="moduleSearch" type="search" placeholder="Buscar módulo"></label>
      <div class="progress-card"><div><span>Tu avance</span><b id="progressLabel">0%</b></div><div class="progress-track"><i id="progressBar"></i></div><small>El progreso se guarda en este navegador.</small></div>
      <nav class="module-nav" id="moduleNav" aria-label="Módulos del curso"></nav>
    </aside>

    <section class="lesson-workspace">
      <div class="workspace-topbar"><div class="breadcrumbs"><span>Open Course CCT</span><b>›</b><strong id="breadcrumbModule">Módulo</strong></div><div class="workspace-tools"><button id="themeToggle" type="button" aria-label="Cambiar contraste">◐</button><span>ES</span></div></div>
      <article class="lesson-content" id="lessonContent" aria-live="polite"></article>
      <footer class="lesson-nav"><button id="prevModule" type="button">← Anterior</button><button id="completeModule" class="complete-btn" type="button">Marcar como completado ✓</button><button id="nextModule" type="button">Siguiente →</button></footer>
    </section>
  </main>

  <script src="course.js"></script>
</body>
</html>
